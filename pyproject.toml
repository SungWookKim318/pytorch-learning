[project]
name = "pytorch-learning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "ruff>=0.17.1",
]

# Install `common/` into .venv so `from common.device import get_device` works from any folder.
[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "common"
module-root = ""
